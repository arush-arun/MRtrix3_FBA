# FBA Pipeline Configuration for MeDALS DWI Dataset — Session 02
# 7T multi-shell (b=0,1000,2500), 97 volumes, 1.8mm native

# Paths — update these for your environment
INPUT_PATH=/scratch/user/$USER/als/MeDALS_DWI/bids
DERIVATIVES_PATH=/scratch/user/$USER/als/MeDALS_DWI/derivatives

# BIDS naming convention
SESSION=ses-02

# Phase encoding directions
MAIN_PE_DIR=AP
BLIPPED_PE_DIR=PA

# Processing parameters
VOXEL_SIZE=1.25
PHASE_ENCODING_DIR=AP

# Quality control
MIN_SNR=10

# Resume capability
ENABLE_CHECKPOINTS=true
CHECKPOINT_DIR=/scratch/user/$USER/als/MeDALS_DWI/fba_checkpoints

# Advanced options
EDDY_OPTIONS="--slm=linear --repol --cnr_maps"
FORCE_OVERWRITE=true
DEBUG_MODE=false
